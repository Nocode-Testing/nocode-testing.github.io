  <text x="62" y="84" class="body ink">CHAMP DE PREUVES - un tableau de test vivant, entre puzzle abstrait et revue de qualite</text>
  <text x="62" y="112" class="small brand">Accueil + header / desktop 1440 px et mobile 390 px / maquette SVG statique</text>

