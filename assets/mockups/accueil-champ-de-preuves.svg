<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Nocode Testing - Champ de preuves</title>
  <desc id="desc">Planche de maquette statique montrant un accueil desktop et mobile. La direction forme un laboratoire graphique avec une grille de cartes et de vecteurs de verification abstraits.</desc>
  <style>
    .bg{fill:#f4f0e9}.screen{fill:#fffdf8;stroke:#28334a;stroke-width:2}.ink{fill:#28334a}.brand{fill:#5d648c}.pale{fill:#ced7e2}.yellow{fill:#f2c94c}.red{fill:#d85c57}.cyan{fill:#5bc1c6}.white{fill:#fff}.stroke{stroke:#28334a;stroke-width:2}.thin{stroke:#5d648c;stroke-width:2}.grid{stroke:#d5dce3;stroke-width:1}.overline{font:700 13px Arial,sans-serif;letter-spacing:1.4px}.nav{font:600 15px Arial,sans-serif}.body{font:400 18px Arial,sans-serif}.small{font:400 14px Arial,sans-serif}.title{font:700 55px Georgia,serif}.mtitle{font:700 35px Georgia,serif}.card{font:700 20px Georgia,serif}
  </style>
