  <text x="62" y="52" class="micro ink">DIRECTION RECOMMANDEE / HYBRIDE ATELIER CALIBRE</text>
  <text x="62" y="80" class="body brand">Accueil + header, desktop et mobile. Panneau droit actif, cartes legerement decalees, logo embarque.</text>
  <rect x="62" y="118" width="1080" height="950" rx="8" class="screen"/>
  <rect x="62" y="118" width="1080" height="92" rx="8" class="white"/><path d="M62 210H1142" class="line"/>
  <use href="#nct-logo" x="88" y="132" width="58" height="58"/><text x="162" y="158" class="micro ink">NOCODE</text><text x="162" y="181" class="small brand">TESTING</text>
  <text x="719" y="165" class="small brand">QUALITE LOGICIELLE</text><path d="M972 140h124l12 12v36l-12 12H972z" class="ink"/><text x="1004" y="171" class="nav white">Contact</text>
  <text x="116" y="277" class="micro copper">PROTOCOLE 01 / QUALITE LOGICIELLE</text><text x="116" y="347" class="display ink">Tester les idees.</text><text x="116" y="405" class="display ink">Garder les preuves.</text>
  <text x="116" y="451" class="body ink">Du terrain, des methodes et un Labo Test &amp; IA</text><text x="116" y="479" class="body brand">pour les equipes qui preferent comprendre avant d'applaudir.</text>
  <path d="M116 516h162l14 14v31l-14 14H116z" class="brand"/><text x="140" y="551" class="nav white">Lire le blog</text><path d="M308 516h160l14 14v31l-14 14H308z" fill="#f9faf8" stroke="#25323d" stroke-width="2"/><text x="336" y="551" class="nav ink">Voir le labo</text>
  <text x="116" y="621" class="small brand">Note de methode : les raccourcis sont testes avant d'etre conseilles.</text>
  <rect x="862" y="240" width="243" height="500" rx="8" class="brand"/><path d="M862 313h243M886 653h195" stroke="#aeb6cf" stroke-width="1.5"/>
  <text x="886" y="278" class="micro white">EXPLORER / 05</text><text x="886" y="349" class="nav white">01 / Blog</text><path d="M876 376h191l14 14v26l-14 14H876z" fill="#fff"/><text x="894" y="402" class="nav brand">02 / Labo Test &amp; IA</text><text x="886" y="458" class="nav white">03 / Ressources</text><text x="886" y="507" class="nav white">04 / A propos</text>
  <text x="886" y="576" class="small mist">Un panneau qui choisit</text><text x="886" y="598" class="small mist">sa position. Comme un bon test.</text><path d="M886 680h126l14 14v28l-14 14H886z" class="copper"/><text x="914" y="709" class="small white">Nous ecrire</text>
  <rect x="116" y="674" width="390" height="232" rx="8" class="mist"/><text x="142" y="710" class="micro brand">01 / LE TESTEUR DU GRANIER</text><text x="142" y="761" class="card ink">Le terrain garde</text><text x="142" y="789" class="card ink">toujours le dernier mot.</text><path d="M143 830h198" stroke="#5d648c" stroke-width="2"/><text x="142" y="862" class="small ink">Observations utiles, bugs bavards,</text><text x="142" y="882" class="small ink">et le plaisir de les faire parler.</text>
  <rect x="467" y="646" width="386" height="262" rx="8" class="ink"/><text x="494" y="682" class="micro mist">02 / LABO TEST &amp; IA</text><path d="M494 714h304" stroke="#71808b" stroke-width="1.5"/><path d="M516 815c36-69 83-69 112-24s72 50 142-43" fill="none" stroke="#CED7E2" stroke-width="5"/><circle cx="516" cy="815" r="9" class="copper"/><circle cx="628" cy="791" r="9" fill="#fff"/><circle cx="770" cy="748" r="9" class="copper"/><text x="494" y="856" class="small white">Des prototypes qui supportent une question simple :</text><text x="494" y="877" class="small mist">est-ce que cela rend vraiment service ?</text>
  <rect x="674" y="886" width="207" height="112" rx="8" class="white" stroke="#25323d" stroke-width="2"/><text x="697" y="919" class="micro copper">03 / RESSOURCES</text><text x="697" y="955" class="small ink">Les reperes qui</text><text x="697" y="976" class="small ink">meritent le detour.</text><path d="M116 945h513" class="hair"/><text x="116" y="981" class="small brand">Les pieces se croisent, l'ordre de lecture reste net.</text>
  <rect x="1200" y="118" width="330" height="950" rx="24" class="ink"/><rect x="1212" y="136" width="306" height="914" rx="15" class="screen"/><rect x="1212" y="136" width="306" height="75" rx="15" class="white"/>
  <use href="#nct-logo" x="1228" y="149" width="48" height="48"/><text x="1285" y="164" class="micro ink">NOCODE</text><text x="1285" y="181" class="small brand">TESTING</text><path d="M1435 151h51l10 10v24l-10 10h-51z" class="brand"/><text x="1447" y="177" class="small white">Menu</text>
  <rect x="1228" y="232" width="274" height="178" rx="7" class="brand"/><text x="1246" y="260" class="micro mist">NAVIGATION</text><text x="1246" y="292" class="small white">Blog</text><text x="1341" y="292" class="small white">Ressources</text><path d="M1240 310h250l10 10v24l-10 10h-250z" fill="#fff"/><text x="1255" y="335" class="small brand">Labo Test &amp; IA</text><text x="1246" y="371" class="small white">A propos</text><text x="1341" y="371" class="small mist">Contact</text>
  <text x="1228" y="461" class="micro copper">QUALITE LOGICIELLE</text><text x="1228" y="513" class="mobile-display ink">Tester les idees.</text><text x="1228" y="553" class="mobile-display ink">Garder les preuves.</text><text x="1228" y="586" class="small ink">Terrain, methodes et Labo Test &amp; IA.</text><path d="M1228 613h151l12 12v27l-12 12h-151z" class="brand"/><text x="1250" y="641" class="small white">Lire le blog</text>
  <rect x="1228" y="690" width="214" height="150" rx="7" class="mist"/><text x="1246" y="719" class="micro brand">LE TESTEUR</text><text x="1246" y="756" class="small ink">Le terrain garde le</text><text x="1246" y="778" class="small ink">dernier mot. Evidemment.</text><rect x="1375" y="720" width="109" height="148" rx="7" class="ink"/><text x="1390" y="749" class="micro mist">LABO</text><path d="M1390 812c17-37 38-34 59-3" fill="none" stroke="#CED7E2" stroke-width="4"/><circle cx="1390" cy="812" r="6" class="copper"/><circle cx="1449" cy="809" r="6" fill="#fff"/>
  <text x="1228" y="894" class="card ink">Labo Test &amp; IA</text><text x="1228" y="919" class="small brand">Les essais sont invites a argumenter.</text><path d="M1228 944h274" class="hair"/><text x="1228" y="979" class="small ink">Le fond est colore. Le raisonnement aussi.</text>
  <text x="62" y="1122" class="small brand">Palette : bleu ardoise #5D648C, bleu gris #CED7E2, encre #25323D, cuivre doux #A85E44. Le cuivre est toujours accompagne de texte, de forme ou de position ; il ne code jamais seul un etat.</text>
