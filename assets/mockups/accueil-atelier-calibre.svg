  <rect x="1212" y="188" width="306" height="724" rx="14" fill="#fbfcfc"/>
  <rect x="1212" y="188" width="306" height="61" rx="14" class="brand"/>
  <circle cx="1242" cy="218" r="14" fill="#ffffff"/><path d="M1236 218h12M1242 212v12" stroke="#5d648c" stroke-width="2"/>
  <text x="1268" y="223" class="small" fill="#ffffff">NOCODE TESTING</text><text x="1482" y="223" class="body" fill="#ffffff">=</text>
  <text x="1240" y="293" class="badge warm">QUALITE LOGICIELLE</text>
  <text x="1240" y="345" class="mobile-title ink">Tester avec</text><text x="1240" y="386" class="mobile-title ink">methode. Explorer</text><text x="1240" y="427" class="mobile-title ink">avec curiosite.</text>
  <text x="1240" y="466" class="small muted">Retours de terrain et experiences IA.</text>
  <rect x="1240" y="500" width="162" height="46" rx="4" class="brand"/><text x="1264" y="530" class="small" fill="#ffffff">Lire le blog</text>
  <rect x="1240" y="574" width="250" height="126" rx="6" class="pale"/>
  <text x="1260" y="607" class="badge brand">ESSAI EN COURS</text><text x="1260" y="642" class="small ink">Un parcours clair vaut</text><text x="1260" y="666" class="small ink">mieux qu'un effet waouh.</text>
  <text x="1240" y="745" class="small muted">Note : pas de magie, juste des tests.</text>
  <line x1="1240" y1="778" x2="1490" y2="778" class="line"/>
  <text x="1240" y="816" class="body ink">Labo Test &amp; IA</text><text x="1240" y="846" class="small muted">Voir les experiences</text>
  <text x="72" y="982" class="small muted">Codes de maquette : bleu ardoise #5D648C, bleu gris #CED7E2, encre #182331, accent test #B86445. Textes et donnees simulés.</text>
